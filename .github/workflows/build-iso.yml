name: Tedbirge WebOS ISO

# Depo: tedbirgeai/tedbirge.app
# Önyüklenebilir imaj tamamen bu hatta üretilir; son kullanıcı hiçbir şey derlemez.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "crates/**"
      - "public/**"
      - "alpine/**"
      - "scripts/**"
      - ".github/workflows/build-iso.yml"
      - "package.json"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tedbirge-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Rust araç zinciri
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add wasm32-unknown-unknown
          rustc --version && cargo --version

      - name: Bağımsız imaj paketini derle (Wasm + arayüz)
        env:
          TEDBIRGE_ISO: "1"
        run: |
          bun install --frozen-lockfile
          bun run build:iso

      - name: İmaj paketini doğrula
        run: |
          if [ ! -s build-iso/web/index.html ]; then
            echo "::error::build-iso/web/index.html üretilmedi — ön-render adımı çalışmamış."
            ls -la build-iso build-iso/web 2>/dev/null || true
            exit 1
          fi
          if [ ! -s build-iso/web/kernel/tedbirge_kernel.wasm ]; then
            echo "::error::build-iso/web/kernel/tedbirge_kernel.wasm eksik — çekirdek paketlenmemiş."
            exit 1
          fi
          if [ -e dist ]; then
            echo "::error::Yayın çıktısı (dist) imaj derlemesinde oluşmamalı — izolasyon bozulmuş."
            exit 1
          fi
          echo "Paketlenecek dizin: build-iso/web"
          du -sh build-iso/web

      - name: Rust birim testleri (çekirdek · HAL · güç köprüsü)
        run: cargo test --manifest-path crates/Cargo.toml --workspace --exclude tedbirge-kernel

      - name: Güç köprüsünü derle (statik · musl)
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update && sudo apt-get install -y musl-tools
          cargo build --release --target x86_64-unknown-linux-musl \
            --manifest-path crates/tedbirge-sysbridge/Cargo.toml
          BIN=crates/target/x86_64-unknown-linux-musl/release/tedbirge-sysbridge
          [ -s "$BIN" ] || BIN=crates/tedbirge-sysbridge/target/x86_64-unknown-linux-musl/release/tedbirge-sysbridge
          if [ ! -s "$BIN" ]; then
            echo "::error::tedbirge-sysbridge ikilisi üretilemedi."; exit 1
          fi
          rm -rf build-iso/payload/bin/tedbirge-sysbridge
          mkdir -p build-iso/payload/bin
          cp "$BIN" build-iso/payload/bin/tedbirge-sysbridge
          chmod +x build-iso/payload/bin/tedbirge-sysbridge
          ls -l build-iso/payload/bin

      - name: Donanım katmanı yapılandırmasını doğrula
        run: |
          for k in tedbirge-bellek.start tedbirge-oom.start tedbirge-disk.start \
                   tedbirge-sysbridge etc/acpi/PWRF ekran-duzeni.sh sys-api; do
            grep -q "$k" alpine/genapkovl-tedbirge.sh || {
              echo "::error::$k yapılandırma katmanında yok."; exit 1; }
          done
          echo "Donanım katmanı doğrulandı."

      - name: Sürüm etiketi
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./package.json').version")+$(date -u +%Y%m%d)-$(echo "$GITHUB_SHA" | cut -c1-7)"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Alpine ISO derle (Docker · mkimage)
        run: |
          docker run --rm --privileged \
            -v "$PWD:/work" -w /work \
            -e TEDBIRGE_VERSION="${{ steps.ver.outputs.version }}" \
            alpine:3.20 sh /work/alpine/ci-build.sh

      - name: İmajı doğrula (sahte çıktı yayınlanmaz)
        run: |
          ISO=$(ls -1 build-iso/iso/*.iso 2>/dev/null | head -1 || true)
          if [ -z "$ISO" ]; then
            echo "::error::ISO üretilemedi."; exit 1
          fi
          SIZE=$(stat -c%s "$ISO")
          if [ "$SIZE" -lt 104857600 ]; then
            echo "::error::ISO beklenenden küçük ($SIZE bayt) — yayınlanmayacak."; exit 1
          fi
          # Sabit indirme adı: bağlantı sürümden bağımsız çalışsın
          mkdir -p build-iso/iso
          TARGET=build-iso/iso/tedbirge-webos-x86_64.iso
          if [ "$ISO" != "$TARGET" ]; then cp "$ISO" "$TARGET"; fi
          xorriso -indev "$TARGET" -pvd_info 2>/dev/null | grep -q "Volume id.*TEDBIRGE_WEBOS" || {
            echo "::error::ISO birim etiketi TEDBIRGE_WEBOS değil."; exit 1;
          }
          ELTORITO=$(xorriso -indev "$TARGET" -report_el_torito plain 2>&1)
          printf '%s\n' "$ELTORITO"
          printf '%s\n' "$ELTORITO" | grep -qiE 'El Torito|BIOS' || {
            echo "::error::ISO içinde BIOS önyükleme kaydı yok."; exit 1;
          }
          printf '%s\n' "$ELTORITO" | grep -qiE 'UEFI|EFI' || {
            echo "::error::ISO içinde UEFI önyükleme kaydı yok."; exit 1;
          }
          for path in /boot /apks /boot/grub /boot/syslinux; do
            xorriso -indev "$TARGET" -find "$path" -maxdepth 1 -type f -print 2>/dev/null | grep -q . || {
              echo "::error::ISO içinde zorunlu önyükleme alanı yok: $path"; exit 1;
            }
          done
          xorriso -indev "$TARGET" -find / -name '*.apkovl.tar.gz' -type f -print 2>/dev/null | grep -q . || {
            echo "::error::ISO içinde Tedbirge yapılandırma katmanı yok."; exit 1;
          }
          (cd build-iso/iso && sha256sum *.iso > SHA256SUMS)
          echo "ISO=$TARGET" >> "$GITHUB_ENV"

      - name: Açılış testi (QEMU · gerçek donanım senaryoları)
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf
          ISO=build-iso/iso/tedbirge-webos-x86_64.iso
          OVMF_CODE=""
          OVMF_VARS=""
          for candidate in \
            /usr/share/OVMF/OVMF_CODE_4M.fd \
            /usr/share/OVMF/OVMF_CODE.fd \
            /usr/share/edk2/ovmf/OVMF_CODE.fd; do
            if [ -r "$candidate" ]; then OVMF_CODE="$candidate"; break; fi
          done
          for candidate in \
            /usr/share/OVMF/OVMF_VARS_4M.fd \
            /usr/share/OVMF/OVMF_VARS.fd \
            /usr/share/edk2/ovmf/OVMF_VARS.fd; do
            if [ -r "$candidate" ]; then OVMF_VARS="$candidate"; break; fi
          done
          if [ -z "$OVMF_CODE" ]; then
            OVMF_CODE=$(find /usr/share -type f \( -name 'OVMF_CODE_4M.fd' -o -name 'OVMF_CODE.fd' \) -print -quit 2>/dev/null || true)
          fi
          if [ -z "$OVMF_VARS" ]; then
            OVMF_VARS=$(find /usr/share -type f \( -name 'OVMF_VARS_4M.fd' -o -name 'OVMF_VARS.fd' \) -print -quit 2>/dev/null || true)
          fi
          if [ -z "$OVMF_CODE" ] || [ ! -r "$OVMF_CODE" ] || [ -z "$OVMF_VARS" ] || [ ! -r "$OVMF_VARS" ]; then
            echo "::error::UEFI firmware CODE/VARS dosyaları ovmf paketi içinde bulunamadı."
            dpkg -L ovmf 2>/dev/null || true
            exit 1
          fi
          cp "$OVMF_VARS" build-iso/OVMF_VARS.fd
          echo "UEFI firmware: $OVMF_CODE"
          FAIL=0

          # Gercek sahadaki denetleyici/firmware bilesimleri tek tek denenir.
          # Tek bir USB senaryosu, eski masaustlerindeki SATA/IDE acilisini
          # dogrulamadigi icin yesil gorunup sahada cokuyordu.
          # QEMU canli sistemi kapanmaz: acilis basarili olsa bile surec calismaya
          # devam eder. Bu yuzden "timeout"un kendisi eskiden her zaman 124 ile
          # donuyor ve saglam imaj bile basarisiz sayiliyordu. Dogru yontem:
          # QEMU'yu arka planda baslat, seri gunlugu izle, karar verilir verilmez
          # sureci kapat.
          BOOT_TIMEOUT="${BOOT_TIMEOUT:-420}"
          run_case() {
            NAME="$1"; MEM="$2"; shift 2
            LOG="build-iso/boot-$NAME.log"
            ERR="build-iso/boot-$NAME.stderr.log"
            : > "$LOG"
            : > "$ERR"
            echo "==== senaryo: $NAME (${MEM} MB) ===="
            qemu-system-x86_64 \
              -m "$MEM" -smp 2 -display none -no-reboot \
              -drive if=none,id=media,format=raw,readonly=on,file="$ISO" \
              "$@" -serial file:"$LOG" 2>"$ERR" &
            QPID=$!

            RESULT="timeout"
            i=0
            while [ "$i" -lt "$BOOT_TIMEOUT" ]; do
              if grep -qiE "Mounting boot media failed|not found in new root|emergency recovery shell|Kernel panic|Attempted to kill init|can't execute .*/sbin/init|No space left on device|apk:.*error" "$LOG" 2>/dev/null; then
                RESULT="panic"; break
              fi
              if grep -q "TEDBIRGE_BOOT_READY" "$LOG" 2>/dev/null; then
                RESULT="ok"; break
              fi
              if ! kill -0 "$QPID" 2>/dev/null; then
                RESULT="exited"; break
              fi
              sleep 2
              i=$((i + 2))
            done

            kill -9 "$QPID" 2>/dev/null || true
            wait "$QPID" 2>/dev/null || true
            tail -n 60 "$LOG" 2>/dev/null || true
            if [ -s "$ERR" ]; then
              echo "---- QEMU stderr ($NAME) ----"
              cat "$ERR"
            fi

            case "$RESULT" in
              ok) echo "$NAME testi gecti." ;;
              panic) echo "::error::$NAME — canli ortam acilamadi (kurtarma kabugu / kernel panic)."; FAIL=1 ;;
              exited) echo "::error::$NAME — QEMU acilis tamamlanmadan sonlandi."; FAIL=1 ;;
              *) echo "::error::$NAME — ${BOOT_TIMEOUT}s icinde servis baslangici gorulmedi."; FAIL=1 ;;
            esac
          }

          # 1) USB bellek (mevcut saha kullanimi)
          run_case usb-ehci 4096 -usb -device usb-ehci,id=ehci -device usb-storage,bus=ehci.0,drive=media
          # 2) SATA/AHCI optik veya disk (cogu masaustu ve dizustu)
          run_case sata-ahci 4096 -device ahci,id=ahci -device ide-cd,bus=ahci.0,drive=media
          # 3) Klasik IDE (eski masaustu, Gigabyte H81M gibi CSM acilisi)
          run_case ide-legacy 4096 -M pc -device ide-cd,bus=ide.0,drive=media -boot d
          # 4) UEFI firmware
          run_case uefi 4096 \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
            -drive if=pflash,format=raw,file=build-iso/OVMF_VARS.fd \
            -device ahci,id=ahci -device ide-cd,bus=ahci.0,drive=media
          # 5) Dusuk bellek tabani (2 GB) — canli kok bu esikte kurulabilmeli
          run_case dusuk-bellek 2048 -usb -device usb-ehci,id=ehci -device usb-storage,bus=ehci.0,drive=media


          if [ "$FAIL" -ne 0 ]; then
            echo "::error::Acilis testleri basarisiz — imaj yayinlanmayacak."
            exit 1
          fi
          echo "Tum acilis senaryolari gecti."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tedbirge-boot-test-log
          path: build-iso/boot-*.log
          if-no-files-found: ignore



      - uses: actions/upload-artifact@v4
        with:
          name: tedbirge-webos-iso
          path: |
            build-iso/iso/*.iso
            build-iso/iso/SHA256SUMS

      - name: Yayınla (sürüm etiketi)
        if: github.event_name == 'release' || github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build-iso/iso/*.iso
            build-iso/iso/SHA256SUMS

      - name: Yayınla (latest ön-sürüm)
        if: github.event_name != 'release' && github.ref_type != 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Tedbirge® WebOS — güncel imaj"
          prerelease: true
          overwrite_files: true
          body: "Otomatik derleme · ${{ steps.ver.outputs.version }} · tedbirgeai/tedbirge.app"
          files: |
            build-iso/iso/*.iso
            build-iso/iso/SHA256SUMS
