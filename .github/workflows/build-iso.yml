name: Tedbirge WebOS ISO

# Depo: tedbirgeai/tedbirge.app
# Önyüklenebilir imaj tamamen bu hatta üretilir; son kullanıcı hiçbir şey derlemez.
#
# MİMARİ: kök dosya sistemi DERLEME sırasında bir kez kurulur ve squashfs olarak
# ISO'ya konur (Debian live-build). Kullanıcının bilgisayarı açılışta paket
# kurmaz — eski Alpine hattındaki "Attempted to kill init" paniğinin kaynağı
# buydu ve mimari değişimiyle tamamen ortadan kalkmıştır.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "crates/**"
      - "public/**"
      - "image/**"
      - "scripts/**"
      - ".github/workflows/build-iso.yml"
      - "package.json"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tedbirge-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Iki urun surumu tek depodan uretilir: workstation (masaustu/laptop) ve
    # touch (tablet/2'si 1 arada). Her surum ayri is olarak derlenip dogrulanir.
    strategy:
      fail-fast: false
      matrix:
        edition: [workstation, touch]
    # ISO derleme + acilis testi + BIOS/UEFI kalici kurulum zinciri en kotu
    # durumda ~100 dakika surer; 120 dakika sinira cok yakindi.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Rust araç zinciri
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add wasm32-unknown-unknown
          rustc --version && cargo --version

      - name: Bağımsız imaj paketini derle (Wasm + arayüz)
        env:
          TEDBIRGE_ISO: "1"
        run: |
          bun install --frozen-lockfile
          bun run build:iso

      - name: İmaj paketini doğrula
        run: |
          if [ ! -s build-iso/web/index.html ]; then
            echo "::error::build-iso/web/index.html üretilmedi — ön-render adımı çalışmamış."
            ls -la build-iso build-iso/web 2>/dev/null || true
            exit 1
          fi
          if [ ! -s build-iso/web/kernel/tedbirge_kernel.wasm ]; then
            echo "::error::build-iso/web/kernel/tedbirge_kernel.wasm eksik — çekirdek paketlenmemiş."
            exit 1
          fi
          if [ -e dist ]; then
            echo "::error::Yayın çıktısı (dist) imaj derlemesinde oluşmamalı — izolasyon bozulmuş."
            exit 1
          fi
          echo "Paketlenecek dizin: build-iso/web"
          du -sh build-iso/web

      - name: Rust birim testleri (çekirdek · HAL · güç köprüsü)
        run: cargo test --manifest-path crates/Cargo.toml --workspace --exclude tedbirge-kernel

      - name: Güç köprüsünü derle (statik · musl)
        run: |
          rustup target add x86_64-unknown-linux-musl
          export DEBIAN_FRONTEND=noninteractive
          sudo -E apt-get update
          sudo -E apt-get install -y -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" musl-tools zstd
          cargo build --release --target x86_64-unknown-linux-musl \
            --manifest-path crates/tedbirge-sysbridge/Cargo.toml
          BIN=crates/target/x86_64-unknown-linux-musl/release/tedbirge-sysbridge
          [ -s "$BIN" ] || BIN=crates/tedbirge-sysbridge/target/x86_64-unknown-linux-musl/release/tedbirge-sysbridge
          if [ ! -s "$BIN" ]; then
            echo "::error::tedbirge-sysbridge ikilisi üretilemedi."; exit 1
          fi
          mkdir -p build-iso/payload/bin
          cp "$BIN" build-iso/payload/bin/tedbirge-sysbridge
          chmod +x build-iso/payload/bin/tedbirge-sysbridge

      - name: Kurulum imajı yapılandırmasını doğrula
        run: bash scripts/check-image-config.sh

      - name: Sürüm etiketi
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./package.json').version")+$(date -u +%Y%m%d)-$(echo "$GITHUB_SHA" | cut -c1-7)"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: ISO derle (Debian live-build · önceden pişirilmiş squashfs kök · ${{ matrix.edition }})
        run: |
          docker run --rm --privileged \
            -v "$PWD:/work" -w /work \
            -e TEDBIRGE_EDITION="${{ matrix.edition }}" \
            -e TEDBIRGE_VERSION="${{ steps.ver.outputs.version }}" \
            -e TEDBIRGE_COMMIT="$GITHUB_SHA" \
            -e TEDBIRGE_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            debian:bookworm bash /work/image/build.sh

      - name: İmajı doğrula (sahte çıktı yayınlanmaz)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo -E apt-get update
          sudo -E apt-get install -y -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" xorriso squashfs-tools zstd
          bash scripts/verify-iso.sh "build-iso/iso/tedbirge-webos-${{ matrix.edition }}-x86_64.iso"

      - name: Açılış testi (QEMU · gerçek donanım senaryoları)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo -E apt-get install -y -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" qemu-system-x86 ovmf mtools zstd
          ISO="build-iso/iso/tedbirge-webos-${{ matrix.edition }}-x86_64.iso"
          OVMF_CODE=""; OVMF_VARS=""
          for c in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd \
                   /usr/share/edk2/ovmf/OVMF_CODE.fd; do
            [ -r "$c" ] && { OVMF_CODE="$c"; break; }
          done
          for c in /usr/share/OVMF/OVMF_VARS_4M.fd /usr/share/OVMF/OVMF_VARS.fd \
                   /usr/share/edk2/ovmf/OVMF_VARS.fd; do
            [ -r "$c" ] && { OVMF_VARS="$c"; break; }
          done
          [ -n "$OVMF_CODE" ] || OVMF_CODE=$(find /usr/share -type f -name 'OVMF_CODE*.fd' -print -quit)
          [ -n "$OVMF_VARS" ] || OVMF_VARS=$(find /usr/share -type f -name 'OVMF_VARS*.fd' -print -quit)
          if [ -z "$OVMF_CODE" ] || [ -z "$OVMF_VARS" ]; then
            echo "::error::UEFI firmware bulunamadı."; exit 1
          fi
          cp "$OVMF_VARS" build-iso/OVMF_VARS.fd
          FAIL=0
          BOOT_TIMEOUT="${BOOT_TIMEOUT:-600}"

          run_case() {
            NAME="$1"; MEM="$2"; shift 2
            LOG="build-iso/boot-$NAME.log"; ERR="build-iso/boot-$NAME.stderr.log"
            : > "$LOG"; : > "$ERR"
            echo "==== senaryo: $NAME (${MEM} MB) ===="
            qemu-system-x86_64 \
              -m "$MEM" -smp 2 -display none -no-reboot \
              -drive if=none,id=media,format=raw,readonly=on,file="$ISO" \
              "$@" -serial file:"$LOG" 2>"$ERR" &
            QPID=$!
            RESULT="timeout"; i=0
            while [ "$i" -lt "$BOOT_TIMEOUT" ]; do
              if grep -q "TEDBIRGE_BOOT_READY" "$LOG" 2>/dev/null; then RESULT="ok"; break; fi
              if grep -qiE "Kernel panic|Attempted to kill init|Unable to mount root|Cannot find live |No such file or directory.*filesystem.squashfs|Failed to start Tedbirge|No bootable device|Boot failed" "$LOG" 2>/dev/null; then
                RESULT="panic"; break
              fi
              kill -0 "$QPID" 2>/dev/null || { RESULT="exited"; break; }
              sleep 2; i=$((i + 2))
            done
            kill -9 "$QPID" 2>/dev/null || true; wait "$QPID" 2>/dev/null || true
            tail -n 60 "$LOG" 2>/dev/null || true
            [ -s "$ERR" ] && { echo "---- QEMU stderr ($NAME) ----"; cat "$ERR"; }
            case "$RESULT" in
              ok) echo "$NAME testi geçti." ;;
              panic) echo "::error::$NAME — canlı ortam açılamadı."; FAIL=1 ;;
              exited) echo "::error::$NAME — QEMU açılış tamamlanmadan sonlandı."; FAIL=1 ;;
              *) echo "::error::$NAME — ${BOOT_TIMEOUT}s içinde hazır sinyali görülmedi."; FAIL=1 ;;
            esac
          }

          run_case usb-ehci   4096 -usb -device usb-ehci,id=ehci -device usb-storage,bus=ehci.0,drive=media,bootindex=0
          run_case sata-ahci  4096 -device ahci,id=ahci -device ide-cd,bus=ahci.0,drive=media,bootindex=0
          run_case ide-legacy 4096 -M pc -device ide-cd,bus=ide.0,drive=media,bootindex=0 -boot d
          run_case uefi       4096 \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
            -drive if=pflash,format=raw,file=build-iso/OVMF_VARS.fd \
            -device ahci,id=ahci -device ide-cd,bus=ahci.0,drive=media,bootindex=0
          run_case dusuk-bellek 2048 -usb -device usb-ehci,id=ehci -device usb-storage,bus=ehci.0,drive=media,bootindex=0


          if [ "$FAIL" -ne 0 ]; then
            echo "::error::Açılış testleri başarısız — imaj yayınlanmayacak."; exit 1
          fi
          echo "Tüm açılış senaryoları geçti."

      - name: Kalıcı kurulum testi (diske kur + kurulan sistemden aç · ${{ matrix.edition }})
        env:
          TEDBIRGE_ISO: build-iso/iso/tedbirge-webos-${{ matrix.edition }}-x86_64.iso
        run: bash scripts/test-install-qemu.sh

      - name: Haber ve WebOS içerik kontrolü
        run: |
          node - <<'NODE'
          const endpoints = [
            'https://tedbirge.app/api/public/haberler',
            'https://tedbirge-app.lovable.app/api/public/haberler',
          ];
          let ok = false;
          for (const endpoint of endpoints) {
            try {
              const response = await fetch(endpoint, { signal: AbortSignal.timeout(20000) });
              const body = await response.json();
              const items = Array.isArray(body) ? body : body.items;
              if (response.ok && Array.isArray(items) && items.length > 0) {
                console.log(`Haber kaynağı doğrulandı: ${endpoint} (${items.length} kayıt)`);
                ok = true;
                break;
              }
            } catch (error) {
              console.warn(`Haber kaynağı yanıt vermedi: ${endpoint}`, error.message);
            }
          }
          if (!ok) throw new Error('Hiçbir doğrulanmış haber kaynağı kayıt döndürmedi.');
          NODE

      - name: Yayın kimliğini onayla (${{ matrix.edition }})
        run: |
          MANIFEST="build-iso/iso/TEDBIRGE-ISO-MANIFEST-${{ matrix.edition }}.json"
          node -e 'const fs=require("fs"); const p=process.argv[1]; const m=JSON.parse(fs.readFileSync(p)); m.validated=true; fs.writeFileSync(p, JSON.stringify(m)+"\n")' "$MANIFEST"
          cat "$MANIFEST"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tedbirge-boot-test-log-${{ matrix.edition }}
          path: build-iso/*.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: tedbirge-webos-iso-${{ matrix.edition }}
          path: |
            build-iso/iso/*.iso
            build-iso/iso/SHA256SUMS-${{ matrix.edition }}
            build-iso/iso/TEDBIRGE-ISO-MANIFEST-${{ matrix.edition }}.json

      - name: Yayınla (sürüm etiketi)
        if: github.event_name == 'release' || github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build-iso/iso/*.iso
            build-iso/iso/SHA256SUMS-${{ matrix.edition }}
            build-iso/iso/TEDBIRGE-ISO-MANIFEST-${{ matrix.edition }}.json

      - name: Yayınla (latest ön-sürüm)
        if: github.event_name != 'release' && github.ref_type != 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Tedbirge® WebOS — güncel imaj"
          prerelease: true
          overwrite_files: true
          body: "Otomatik derleme · ${{ steps.ver.outputs.version }} · ${{ matrix.edition }} · tedbirgeai/tedbirge.app"
          files: |
            build-iso/iso/*.iso
            build-iso/iso/SHA256SUMS-${{ matrix.edition }}
            build-iso/iso/TEDBIRGE-ISO-MANIFEST-${{ matrix.edition }}.json
