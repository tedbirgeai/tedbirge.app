name: Tedbirge WebOS ISO

# Depo: tedbirgeai/tedbirge.app
# Önyüklenebilir imaj tamamen bu hatta üretilir; son kullanıcı hiçbir şey derlemez.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "crates/**"
      - "public/**"
      - "alpine/**"
      - "scripts/**"
      - ".github/workflows/build-iso.yml"
      - "package.json"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tedbirge-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Rust araç zinciri
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add wasm32-unknown-unknown
          rustc --version && cargo --version

      - name: Bağımsız imaj paketini derle (Wasm + arayüz)
        env:
          TEDBIRGE_ISO: "1"
        run: |
          bun install --frozen-lockfile
          bun run build:iso

      - name: İmaj paketini doğrula
        run: |
          if [ ! -s build-iso/web/index.html ]; then
            echo "::error::build-iso/web/index.html üretilmedi — ön-render adımı çalışmamış."
            ls -la build-iso build-iso/web 2>/dev/null || true
            exit 1
          fi
          if [ ! -s build-iso/web/kernel/tedbirge_kernel.wasm ]; then
            echo "::error::build-iso/web/kernel/tedbirge_kernel.wasm eksik — çekirdek paketlenmemiş."
            exit 1
          fi
          if [ -e dist ]; then
            echo "::error::Yayın çıktısı (dist) imaj derlemesinde oluşmamalı — izolasyon bozulmuş."
            exit 1
          fi
          echo "Paketlenecek dizin: build-iso/web"
          du -sh build-iso/web

      - name: Rust birim testleri (çekirdek · HAL · güç köprüsü)
        run: cargo test --manifest-path crates/Cargo.toml --workspace --exclude tedbirge-kernel

      - name: Güç köprüsünü derle (statik · musl)
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update && sudo apt-get install -y musl-tools
          cargo build --release --target x86_64-unknown-linux-musl \
            --manifest-path crates/tedbirge-sysbridge/Cargo.toml
          BIN=crates/target/x86_64-unknown-linux-musl/release/tedbirge-sysbridge
          [ -s "$BIN" ] || BIN=crates/tedbirge-sysbridge/target/x86_64-unknown-linux-musl/release/tedbirge-sysbridge
          if [ ! -s "$BIN" ]; then
            echo "::error::tedbirge-sysbridge ikilisi üretilemedi."; exit 1
          fi
          rm -rf build-iso/payload/bin/tedbirge-sysbridge
          mkdir -p build-iso/payload/bin
          cp "$BIN" build-iso/payload/bin/tedbirge-sysbridge
          chmod +x build-iso/payload/bin/tedbirge-sysbridge
          ls -l build-iso/payload/bin

      - name: Donanım katmanı yapılandırmasını doğrula
        run: |
          for k in mesa-vulkan-intel linux-firmware-iwlwifi acpid zram-init pipewire nvme-cli; do
            grep -q "$k" alpine/mkimg.tedbirge.sh || {
              echo "::error::$k imaj paket listesinde yok."; exit 1; }
          done
          for k in tedbirge-bellek.start tedbirge-oom.start tedbirge-disk.start \
                   tedbirge-sysbridge etc/acpi/PWRF ekran-duzeni.sh sys-api; do
            grep -q "$k" alpine/genapkovl-tedbirge.sh || {
              echo "::error::$k yapılandırma katmanında yok."; exit 1; }
          done
          echo "Donanım katmanı doğrulandı."

      - name: Sürüm etiketi
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./package.json').version")+$(date -u +%Y%m%d)-$(echo "$GITHUB_SHA" | cut -c1-7)"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Alpine ISO derle (Docker · mkimage)
        run: |
          docker run --rm --privileged \
            -v "$PWD:/work" -w /work \
            -e TEDBIRGE_VERSION="${{ steps.ver.outputs.version }}" \
            alpine:3.20 sh /work/alpine/ci-build.sh

      - name: İmajı doğrula (sahte çıktı yayınlanmaz)
        run: |
          ISO=$(ls -1 build-iso/iso/*.iso 2>/dev/null | head -1 || true)
          if [ -z "$ISO" ]; then
            echo "::error::ISO üretilemedi."; exit 1
          fi
          SIZE=$(stat -c%s "$ISO")
          if [ "$SIZE" -lt 104857600 ]; then
            echo "::error::ISO beklenenden küçük ($SIZE bayt) — yayınlanmayacak."; exit 1
          fi
          # Sabit indirme adı: bağlantı sürümden bağımsız çalışsın
          mkdir -p build-iso/iso
          TARGET=build-iso/iso/tedbirge-webos-x86_64.iso
          if [ "$ISO" != "$TARGET" ]; then cp "$ISO" "$TARGET"; fi
          (cd build-iso/iso && sha256sum *.iso > SHA256SUMS)
          echo "ISO=$ISO" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: tedbirge-webos-iso
          path: |
            build-iso/iso/*.iso
            build-iso/iso/SHA256SUMS

      - name: Yayınla (sürüm etiketi)
        if: github.event_name == 'release' || github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build-iso/iso/*.iso
            build-iso/iso/SHA256SUMS

      - name: Yayınla (latest ön-sürüm)
        if: github.event_name != 'release' && github.ref_type != 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Tedbirge® WebOS — güncel imaj"
          prerelease: true
          overwrite_files: true
          body: "Otomatik derleme · ${{ steps.ver.outputs.version }} · tedbirgeai/tedbirge.app"
          files: |
            build-iso/iso/*.iso
            build-iso/iso/SHA256SUMS
