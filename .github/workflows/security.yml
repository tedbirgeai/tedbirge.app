name: Security

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Nightly re-scan so drift is caught even without a commit.
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  invariants:
    name: Database security invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Re-checks the six findings closed on 2026-07-30: no migration may hand
      # write privileges on the service-role-only tables back to anon/authenticated.
      - name: Verify RLS + grant invariants
        run: bun run security:check

      - name: Lint
        run: bun run lint

  tests:
    name: E2EE isolation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Proves relays cannot read message bodies and tampered packets are rejected.
      - name: Mesh E2EE isolation suite
        run: bun run test

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Denetim yalnizca gercek yuksek/kritik zafiyette durur. Kayit servisi
      # ulasilamazsa (404/5xx/ag hatasi) is uyari ile gecer.
      - name: Audit
        shell: bash
        run: |
          set +e
          out="$(npm audit --audit-level=high --json 2>&1)"
          code=$?
          echo "$out" | head -c 20000
          if [ $code -eq 0 ]; then
            echo "Yuksek/kritik zafiyet yok."
            exit 0
          fi
          high=$(printf '%s' "$out" | grep -oE '"high"[[:space:]]*:[[:space:]]*[0-9]+' | grep -oE '[0-9]+$' | head -n1)
          crit=$(printf '%s' "$out" | grep -oE '"critical"[[:space:]]*:[[:space:]]*[0-9]+' | grep -oE '[0-9]+$' | head -n1)
          if [ -n "$high" ] || [ -n "$crit" ]; then
            if [ "${high:-0}" -gt 0 ] || [ "${crit:-0}" -gt 0 ]; then
              echo "::error::Yuksek: ${high:-0}, Kritik: ${crit:-0} zafiyet bulundu."
              exit 1
            fi
            echo "Yuksek/kritik zafiyet yok."
            exit 0
          fi
          echo "::warning::Bagimlilik denetim servisi yanit vermedi; adim atlandi."
          exit 0


