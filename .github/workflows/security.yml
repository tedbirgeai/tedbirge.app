name: Security

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Nightly re-scan so drift is caught even without a commit.
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  invariants:
    name: Database security invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Re-checks the six findings closed on 2026-07-30: no migration may hand
      # write privileges on the service-role-only tables back to anon/authenticated.
      - name: Verify RLS + grant invariants
        run: bun run security:check

      - name: Lint
        run: bun run lint

  tests:
    name: E2EE isolation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Proves relays cannot read message bodies and tampered packets are rejected.
      - name: Mesh E2EE isolation suite
        run: bun run test

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Denetim, bun'in serdigi node_modules agacindan degil, temiz bir
      # cozumlemeden yapilir; aksi halde npm mevcut agaci okuyup gercekte
      # kurulmayan eski surumleri raporluyordu (sahte "yuksek" bulgular).
      - name: Temiz cozumleme (denetim icin)
        id: resolve
        shell: bash
        run: |
          mkdir -p /tmp/audit
          cp package.json /tmp/audit/package.json
          cd /tmp/audit
          set +e
          npm install --package-lock-only --package-lock=true --ignore-scripts \
            --no-audit --no-fund --legacy-peer-deps > resolve.log 2>&1
          RC=$?
          set -e
          tail -n 40 resolve.log || true
          if [ "$RC" -ne 0 ] || [ ! -s package-lock.json ]; then
            # Bazi paket surumleri yalnizca kurulum kayit defterinden cozulur
            # (npm ETARGET). Bu bir zafiyet degildir; denetim atlanir.
            echo "::warning::Denetim kilidi uretilemedi; bagimlilik denetimi atlandi."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi


      # Yalnizca gercek yuksek/kritik zafiyette durur. Kayit servisi
      # ulasilamazsa (404/5xx/ag hatasi) is uyari ile gecer.
      - name: Audit
        shell: bash
        working-directory: /tmp/audit
        run: |
          set +e
          npm audit --json --registry=https://registry.npmjs.org > audit.json 2>&1
          node -e '
            const fs = require("fs");
            let d;
            try { d = JSON.parse(fs.readFileSync("audit.json", "utf8")); } catch {
              console.log("::warning::Bagimlilik denetim servisi yanit vermedi; adim atlandi.");
              process.exit(0);
            }
            const m = d.metadata && d.metadata.vulnerabilities;
            if (!m) {
              console.log("::warning::Bagimlilik denetim servisi yanit vermedi; adim atlandi.");
              process.exit(0);
            }
            console.log("Ozet:", JSON.stringify(m));
            const bad = Object.entries(d.vulnerabilities || {})
              .filter(([, v]) => v.severity === "high" || v.severity === "critical");
            for (const [name, v] of bad) {
              console.log(`${v.severity}: ${name} ${v.range || ""} (duzeltme: ${v.fixAvailable ? "var" : "yok"})`);
            }
            if (bad.length) {
              console.log(`::error::Yuksek: ${m.high}, Kritik: ${m.critical} zafiyet bulundu.`);
              process.exit(1);
            }
            console.log("Yuksek/kritik zafiyet yok.");
          '



