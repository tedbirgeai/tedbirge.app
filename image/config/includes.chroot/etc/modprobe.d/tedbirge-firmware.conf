# Tedbirge(R) WebOS — surucu/firmware bagimsizligi.
#
# Realtek USB Wi-Fi (rtl8xxxu) ve benzeri modüller firmware bulamayinca
# ("failed to load firmware", "error -11") tekrar tekrar denemeye calisip
# acilisi bekletebiliyor. Asagidaki ayarlar bu modulleri "olursa calisir"
# konumuna alir: firmware yoksa modul sessizce devre disi kalir, acilis
# zinciri beklemez ve masaustu yine gelir.

# Yeniden deneme dongusunu kapat.
options rtl8xxxu ht40_2g=0
options cfg80211 cfg80211_disable_40mhz_24ghz=1

# Ses kartlari: firmware/kart yoksa modul yuklenmesi acilisi durdurmasin.
options snd-hda-intel probe_mask=1 power_save=0

# Firmware yuklemesi basarisiz olursa cekirdek beklemesin (5 sn tavan).
options firmware_class path=/lib/firmware
