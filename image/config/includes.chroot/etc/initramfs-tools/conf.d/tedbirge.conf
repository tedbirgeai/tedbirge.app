# Tedbirge(R) WebOS — baslangic diski (initramfs) uretim ayarlari.
#
# MODULES=dep: her surucuyu degil, yalnizca gerekli olanlari paketler.
# Zorunlu aygit surucileri /etc/initramfs-tools/modules ile ayrica eklenir,
# bu yuzden kapsam kaybi olmaz; uretim suresi ve dosya boyutu ciddi duser.
MODULES=dep

# zstd -1: en hizli sikistirma. Kurulum sirasindaki en pahali adim buydu.
COMPRESS=zstd
COMPRESSLEVEL=1

# Canli sistemin gerektirdigi bilesenler.
BUSYBOX=y
KEYMAP=n
RUNSIZE=256M
