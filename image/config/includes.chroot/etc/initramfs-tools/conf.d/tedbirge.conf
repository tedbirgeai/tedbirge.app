# Tedbirge(R) WebOS — baslangic diski (initramfs) uretim ayarlari.
#
# Canli ISO her bilgisayarda acilmak zorunda oldugu icin genis surucu kapsami
# korunur (MODULES=most). Hiz kazanci sikistirmadan gelir: zstd -1 en hizlisi.
MODULES=most
COMPRESS=zstd
COMPRESSLEVEL=1
BUSYBOX=y
# Kurumsal acilis ekrani (Plymouth) initramfs asamasinda da gorunsun.
FRAMEBUFFER=y
