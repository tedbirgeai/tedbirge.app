server {
    listen 80 default_server;
    listen [::]:80 default_server;
    root /var/www/tedbirge;
    index index.html;

    # Wasm çekirdeği için izolasyon başlıkları (SharedArrayBuffer)
    add_header Cross-Origin-Opener-Policy   "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Content-Type-Options       "nosniff" always;
    # Z3/Lean 4 WASM doğrulama motoru ve çekirdek daemon'ı için.
    add_header Content-Security-Policy       "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-inline'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:" always;

    types { application/wasm wasm; }

    location /kernel/ {
        add_header Cross-Origin-Opener-Policy   "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Yerel güç köprüsü (kapat / yeniden başlat / uyku) — yalnız bu makine
    location /sys-api/ {
        proxy_pass http://127.0.0.1:8378/;
        proxy_http_version 1.1;
        allow 127.0.0.1;
        allow ::1;
        deny all;
    }

    # Tek sayfalık uygulama: bilinmeyen yollar kabuğa düşer
    location / {
        try_files $uri $uri/ /index.html;
    }
}
