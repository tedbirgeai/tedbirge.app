## Tedbirge(R) WebOS — BIOS acilis yapilandirmasi.
## Debian live-build varsayilani "timeout 0" ile menude SONSUZ bekler; bu yuzden
## hem CI hem de gercek donanimda sistem hicbir zaman kendiliginden acilmaz.
## Burada 5 saniyelik zaman asimi ve seri konsol tanimlanir.
serial 0 115200
include menu.cfg
default vesamenu.c32
prompt 0
timeout 50
