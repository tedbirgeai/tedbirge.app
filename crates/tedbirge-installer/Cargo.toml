[package]
name = "tedbirge-installer"
version = "0.1.0"
edition = "2021"
description = "Tedbirge OS kurulum sihirbazı — disk seçimi, bölümlendirme, kök kopyalama, yükleyici yazımı"

[[bin]]
name = "tedbirge-install"
path = "src/main.rs"

[lib]
name = "tedbirge_installer"
path = "src/lib.rs"

[dependencies]
tedbirge-hal-linux = { path = "../tedbirge-hal-linux" }

[profile.release]
opt-level = "z"
lto = true
strip = true
